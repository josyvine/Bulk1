name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.0.12433566'
          accept-android-sdk-licenses: true

      # 1. Decode Keystore from Base64 secret
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or missing on GitHub! Please add it in Settings > Secrets > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/safevoice.jks
          
          if [ ! -s ${{ github.workspace }}/safevoice.jks ]; then
            echo "::error::The decoded keystore file is empty (0 bytes). Check your Base64 encoding."
            exit 1
          fi
          echo "Keystore successfully decoded. Size: $(wc -c < ${{ github.workspace }}/safevoice.jks) bytes"

      # 2. Print SHA Fingerprints (using default alias 'bulk')
      - name: Print Keystore SHA Fingerprints
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'bulk' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is not set! Skipping fingerprint generation."
            exit 1
          fi
          keytool -list -v \
            -keystore ${{ github.workspace }}/safevoice.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD"

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # 4. Generate fresh Gradle Wrapper
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper

      # 5. Grant execute permission to wrapper
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 6. Build Signed Release APK & Play Store AAB (Passing all Keystore credentials to Gradle)
      - name: Build Release APK & Play Store AAB
        run: ./gradlew clean app:assembleRelease app:bundleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/safevoice.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'bulk' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}

      # 7. Verify 16 KB Page Size Alignment in AAB
      - name: Verify 16 KB Page Size Alignment in AAB
        shell: bash
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB file not found at $AAB_PATH"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          LLVM_OBJDUMP=$(find "$SDK_DIR/ndk" -name "llvm-objdump" | sort -V | tail -n 1)
          if [ -z "$LLVM_OBJDUMP" ]; then
            echo "❌ llvm-objdump not found in $SDK_DIR/ndk"
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          unzip -q "$AAB_PATH" "base/lib/arm64-v8a/*" "base/lib/x86_64/*" -d "$TMP_DIR" || true

          FAILED=0
          FOUND=0
          while IFS= read -r -d '' SO; do
            FOUND=1
            REL_PATH="${SO#$TMP_DIR/}"
            echo "Checking: $REL_PATH"
            ALIGNS=$("$LLVM_OBJDUMP" -p "$SO" | grep "LOAD" | awk '{print $NF}')
            if [ -z "$ALIGNS" ]; then
              echo "  ⚠️ No LOAD segments found in $REL_PATH"
              FAILED=1
              continue
            fi
            for A in $ALIGNS; do
              echo "  LOAD align: $A"
              EXP=${A#2\*\*}
              if ! [[ "$EXP" =~ ^[0-9]+$ ]] || [ "$EXP" -lt 14 ]; then
                echo "  ❌ UNALIGNED (< 16KB): $REL_PATH ($A)"
                FAILED=1
              fi
            done
          done < <(find "$TMP_DIR" -name "*.so" -print0)

          rm -rf "$TMP_DIR"
          if [ "$FOUND" -eq 0 ]; then
            echo "ℹ️ No 64-bit .so libraries found in AAB."
            exit 0
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ 16 KB page size verification FAILED!"
            exit 1
          fi
          echo "✅ All 64-bit .so libraries in the AAB are 16 KB aligned!"

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # 9. Upload Play Store AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab